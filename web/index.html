<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply the saved theme before first paint so neither mode flashes.
      // Always sets the attribute explicitly — the app stylesheet keys its
      // light palette off html[data-theme='light'].
      (function () {
        var t = 'light';
        try {
          if (localStorage.getItem('lb-theme') === 'dark') t = 'dark';
        } catch (e) {}
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <meta name="description" content="Loadwave — live load board for owner-operators and small fleets. Find loads, book in one tap, and run fuel, IFTA and invoicing in one place." />
    <link rel="preload" as="image" href="/assets/images/container.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Loadwave — Live Load Board for Carriers, Brokers & Shippers</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
