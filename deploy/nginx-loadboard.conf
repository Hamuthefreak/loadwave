# Loadboard — nginx reverse proxy + static hosting
# Install to /etc/nginx/sites-available/loadboard and symlink into sites-enabled.
# Replace loadboard.example.com with your FreeDNS subdomain.

# Allow POD photo uploads (the backend route allows 16 MB bodies).
client_max_body_size 20m;

server {
    listen 80;
    server_name loadboard.example.com;  # <-- REPLACE with your FreeDNS subdomain

    # --- HTTPS is REQUIRED before launch ---
    # Run once, then this block is rewritten by certbot to redirect to https:
    #   sudo certbot --nginx -d loadboard.example.com
    # (see DEPLOY_ORACLE.md). Do not go live on plain HTTP with real accounts.

    root /opt/loadboard/web/dist;
    index index.html;

    # Security headers for static assets (the API adds its own via Helmet).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # API + auth go to the Fastify backend.
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: unknown non-asset routes serve index.html (client routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache fingerprinted assets built by Vite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

