name: Auto-deploy to Oracle VM

on:
  push:
    branches: [main]

# One deploy at a time, always. Overlapping deploys used to run two `npm ci`
# jobs on the same small VM at once and could starve the box. Queued runs wait.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The root jest run also executes (web/) tests, so web dependencies must
      # be installed before `npm test`. Without them every .tsx suite fails
      # with TS2875: react/jsx-runtime not found, failing the whole deploy.
      - name: Install backend and frontend deps
        run: |
          npm ci
          npm --prefix web ci

      - name: Backend - typecheck, lint, tests
        run: |
          npm run typecheck
          npx eslint "src/**/*.ts" "tests/**/*.ts"
          npm test

      - name: Frontend - build
        run: |
          cd web
          npm run build

  deploy:
    name: Deploy to production
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Optional: verify the VM host key so Actions cannot be MITMed.
      # Generate with `ssh-keyscan <VM_IP> | grep ed25519`, store the line in
      # the secret VM_SSH_FINGERPRINT.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          # script_stop is gone from this action - use `set -e` instead.
          script: |
            set -e
            echo "Connecting to production..."
            bash /opt/loadboard/deploy/auto-deploy.sh

  # Side-car: the crypto bot in trading/ (dry run by default). Runs after
  # LoadWave is up and must never turn a good site deploy red; the script also
  # exits 0 by itself when it cannot do anything on this VM.
  trading:
    name: Sync trading bot (freqtrade)
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Sync bot on the VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          script: |
            set -e
            bash /opt/loadboard/trading/deploy/sync-freqtrade.sh
