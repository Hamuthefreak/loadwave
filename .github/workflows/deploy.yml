name: Auto-deploy to Oracle VM

on:
  push:
    branches: [main]
  # Lets you (or an agent) re-run the bot sync without pushing a commit.
  workflow_dispatch:

# One deploy at a time, always. Overlapping deploys used to run two `npm ci`
# jobs on the same small VM at once and could starve the box. Queued runs wait.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The root jest run also executes (web/) tests, so web dependencies must
      # be installed before `npm test`. Without them every .tsx suite fails
      # with TS2875: react/jsx-runtime not found, failing the whole deploy.
      - name: Install backend and frontend deps
        run: |
          npm ci
          npm --prefix web ci

      - name: Backend - typecheck, lint, tests
        run: |
          npm run typecheck
          npx eslint "src/**/*.ts" "tests/**/*.ts"
          npm test

      - name: Frontend - build
        run: |
          cd web
          npm run build

  # The LoadWave site deploy. The production VM is now dedicated to the trading
  # bot, so this job is off unless the repository variable LOADWAVE_ENABLED is
  # set to "true" (Settings -> Secrets and variables -> Actions -> Variables).
  # Without that guard every push would try to run /opt/loadboard/... on a box
  # that no longer has LoadWave and turn the run red.
  deploy:
    name: Deploy LoadWave (off unless LOADWAVE_ENABLED=true)
    if: vars.LOADWAVE_ENABLED == 'true'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Optional: verify the VM host key so Actions cannot be MITMed.
      # Generate with `ssh-keyscan <VM_IP> | grep ed25519`, store the line in
      # the secret VM_SSH_FINGERPRINT.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          # script_stop is gone from this action - use `set -e` instead.
          script: |
            set -e
            echo "Connecting to production..."
            bash /opt/loadboard/deploy/auto-deploy.sh

  # The crypto bot in trading/ (DRY RUN). Deliberately independent of both
  # `verify` and `deploy`: the bot's code has nothing to do with LoadWave, and
  # a red site build must never stop the bot from being updated. continue-on-
  # error keeps a bot problem from turning a good push red.
  trading:
    name: Sync trading bot (freqtrade)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The bot has no checkout of its own on the VM, and the repo is private,
      # so the runner pushes the few files the container needs over SCP instead
      # of asking the VM for a deploy key.
      # Secrets are masked in logs, so a stale VM_HOST looks exactly like a
      # firewalled VM. This reports only the shape of the value and whether the
      # port answers - enough to tell "wrong address" from "blocked port".
      - name: Preflight - can this runner reach the VM?
        env:
          HOST: ${{ secrets.VM_HOST }}
          KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          echo "host length: ${#HOST}"
          if [ "$HOST" = "155.248.239.195" ]; then
            echo "host is the new VM IP: yes"
          else
            echo "host is the new VM IP: NO - the secret is stale"
          fi
          if timeout 15 bash -c "cat < /dev/null > /dev/tcp/$HOST/22"; then
            echo "tcp 22 reachable from runner: yes"
          else
            echo "tcp 22 reachable from runner: NO"
          fi
          # A rejected key and a wrong key are the same error, so report the
          # shape of the secret only - never its contents.
          echo "key length: ${#KEY}"
          echo "key newlines: $(printf '%s' "$KEY" | wc -l)"
          for marker in "BEGIN RSA PRIVATE KEY" "BEGIN OPENSSH PRIVATE KEY" "BEGIN PRIVATE KEY" "BEGIN PUBLIC KEY" "ssh-rsa AAAA"; do
            case "$KEY" in
              *"$marker"*) echo "key contains: $marker" ;;
            esac
          done

      - name: Upload bot files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          source: "trading/**"
          target: "/home/ubuntu/freqtrade-src"
          overwrite: true
          rm: false
          # Oracle + a 1 GB box can be slow to answer the first handshake.
          timeout: 60s

      # The installer is idempotent: it installs Docker on a bare VM, seeds the
      # config once (never overwriting the live one), then pulls and restarts
      # the container. Running it on every push is therefore both first-time
      # setup and the update path.
      - name: Install / update bot on the VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          # Docker install + ~1 GB image pull + readiness wait.
          command_timeout: 20m
          script: |
            set -e
            bash /home/ubuntu/freqtrade-src/trading/deploy/install-freqtrade.sh
