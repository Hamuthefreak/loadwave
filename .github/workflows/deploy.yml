name: Auto-deploy to Oracle VM

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Optional: verify the VM's host key so GitHub Actions can't be
      # MITMed. Generate with:
      #   ssh-keyscan <VM_IP> | grep ed25519
      # then store the line in secret VM_SSH_FINGERPRINT.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}        # your Oracle VM public IPv4
          username: ${{ secrets.VM_USER }}     # usually "ubuntu"
          key: ${{ secrets.VM_SSH_KEY }}       # private key added as a repo secret
          port: 22
          # script_stop was removed from this action — use `set -e` instead.
          script: |
            set -e
            echo "Connecting to production..."
            bash /opt/loadboard/deploy/auto-deploy.sh